  <style>

      const stick=$(id), knob=stick.querySelector('.knob');
      function move(e){
        const rect=stick.getBoundingClientRect(), radius=rect.width*.28;
        let dx=e.clientX-(rect.left+rect.width/2), dy=e.clientY-(rect.top+rect.height/2);
        const length=Math.hypot(dx,dy);
        if(length>radius){dx*=radius/length;dy*=radius/length;}
        input[key].x=dx/radius; input[key].y=dy/radius;
        knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
      }
      stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);move(e);});
      stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))move(e);});
      function release(){input[key].x=0;input[key].y=0;knob.style.transform='translate(-50%,-50%)';}
      stick.addEventListener('pointerup',release);
      stick.addEventListener('pointercancel',release);
      stick.addEventListener('lostpointercapture',release);
    }
    setupStick('leftStick','left'); setupStick('rightStick','right');
    const keys=new Set();
    window.addEventListener('keydown',e=>{
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyS','KeyA','KeyD'].includes(e.code) && e.target.tagName!=='INPUT'){
        e.preventDefault();keys.add(e.code);
      }
    });
    window.addEventListener('keyup',e=>keys.delete(e.code));
    window.addEventListener('blur',()=>keys.clear());

    function findPlayer(){
      record=records.find(r=>r.player_name.trim().toLocaleLowerCase()===player.toLocaleLowerCase())||null;
    }
    const handler={onDataChanged(data){records=data;findPlayer();}};
    (async()=>{
      try {
        const result=await window.dataSdk.init(handler);
        sdkReady=result.isOk;
        if(!result.isOk) $('startError').textContent='진행 기록 연결에 실패했어요. 잠시 후 다시 열어 주세요.';
      } catch(e){$('startError').textContent='진행 기록 연결에 실패했어요. 잠시 후 다시 열어 주세요.';}
    })();

    async function finish(){
      if(complete)return;
      complete=true;running=false;
      updateReadouts(100);
      const earned=Math.max(1,3-collisions);
      $('completeOverlay').classList.remove('hidden');
      $('levelPill').textContent=`${String(level+1).padStart(2,'0')} / 10 · 성공!`;
      $('completeDetails').textContent=`${player} 조종사, ${level+1}단계 성공! 별 ${earned}개를 획득했어요. 기록을 저장하는 중…`;
      $('nextButton').disabled=true;
      $('nextButton').textContent=level===9?'처음부터 다시 도전':'다음 미션';
      if(!sdkReady){
        $('completeDetails').textContent=`${level+1}단계 성공! 기록 연결이 안 되어 저장하지 못했어요. 아래 버튼으로 다시 시도해 주세요.`;
        $('nextButton').textContent='저장 다시 시도';
        $('nextButton').disabled=false;
        return;
      }
      saving=true;
      try{
        if(!record && records.length>=999) throw new Error('기록이 999개로 가득 찼어요.');
        const payload=record
          ? {...record,highest_level:Math.max(Number(record.highest_level)||0,level+1),total_stars:(Number(record.total_stars)||0)+earned,completed_at:new Date().toISOString()}
          : {player_name:player,highest_level:level+1,total_stars:earned,completed_at:new Date().toISOString()};
        const result=record?await window.dataSdk.update(payload):await window.dataSdk.create(payload);
        if(!result.isOk)throw result.error;
        if(record) record=payload;
        $('completeDetails').textContent=`${player} 조종사, ${level+1}단계 성공! 별 ${earned}개를 획득했고 Canva Sheet에 기록했어요.`;
        $('nextButton').textContent=level===9?'처음부터 다시 도전':'다음 미션';
      }catch(e){
        $('completeDetails').textContent=`${level+1}단계 성공! 기록을 저장하지 못했어요. 다시 시도해 주세요.`;
        $('nextButton').textContent='저장 다시 시도';
      }finally{saving=false;$('nextButton').disabled=false;}
    }
    $('nextButton').addEventListener('click',()=>{
      if(saving)return;
      if($('nextButton').textContent==='저장 다시 시도'){complete=false;finish();return;}
      level=level===9?0:level+1;
      resetLevel();
    });
    $('retryButton').addEventListener('click',()=>{
      if(!$('startOverlay').classList.contains('hidden') || saving)return;
      resetLevel();
    });

    const track=$('slideTrack'), thumb=$('slideThumb');
    let slidePointer=null;
    function slideMove(e){
      const rect=track.getBoundingClientRect(), max=rect.width-48;
      const x=Math.max(0,Math.min(max,e.clientX-rect.left-24));
      thumb.style.left=(4+x)+'px';
      track.setAttribute('aria-valuenow',String(Math.round(x/max*100)));
      return x/max;
    }
    function slideReset(){thumb.style.left='4px';track.setAttribute('aria-valuenow','0');}
    function startGame(){
      const form=$('startForm');
      if(!form.reportValidity()){slideReset();return;}
      if(!sdkReady){$('startError').textContent='기록 연결을 확인하고 다시 시도해 주세요.';slideReset();return;}
      player=$('playerName').value.trim();
      if(!player){$('startError').textContent='조종자 이름을 입력해 주세요.';slideReset();return;}
      findPlayer();
      level=Math.min(9,Math.max(0,Number(record?.highest_level)||0));
      $('startOverlay').classList.add('hidden');
      resetLevel();
    }
    $('startForm').addEventListener('submit',e=>e.preventDefault());
    track.addEventListener('pointerdown',e=>{slidePointer=e.pointerId;track.setPointerCapture(e.pointerId);slideMove(e);});
    track.addEventListener('pointermove',e=>{if(slidePointer===e.pointerId)slideMove(e);});
    track.addEventListener('pointerup',e=>{
      if(slidePointer!==e.pointerId)return;
      const fraction=slideMove(e);slidePointer=null;
      if(fraction>.88)startGame(); else slideReset();
    });
    track.addEventListener('pointercancel',()=>{slidePointer=null;slideReset();});
    track.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();startGame();}});

    function draw(){
      ctx.clearRect(0,0,cw,ch);
      ctx.fillStyle='#112536';ctx.fillRect(0,0,cw,ch);
      const grid=Math.max(26,Math.min(cw,ch)/9);
      ctx.strokeStyle='#ffffff0d';ctx.lineWidth=1;
      for(let x=0;x<cw;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ch);ctx.stroke();}
      for(let y=0;y<ch;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke();}
      const scale=Math.min(cw,ch), px=x=>x*cw,py=y=>y*ch;
      ctx.strokeStyle='#4e7880';ctx.lineWidth=2;ctx.setLineDash([9,7]);
      ctx.strokeRect(18,18,cw-36,ch-36);ctx.setLineDash([]);
      // Persistent starting pad
      ctx.beginPath();ctx.arc(px(.3),py(.68),scale*.082,0,Math.PI*2);
      ctx.fillStyle='#244450';ctx.fill();ctx.strokeStyle='#74b4ad';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#a3d8d2';ctx.font=`700 ${Math.max(10,scale*.038)}px Work Sans`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('H',px(.3),py(.68));
      if(running||complete){
        const m=missions[level];
        if(m.x!==undefined){
          const x=px(m.x),y=py(m.y),r=scale*.087;
          ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=m.type==='land'?'#bfe96729':'#c8f35b20';ctx.fill();
          ctx.strokeStyle='#c8f35b';ctx.lineWidth=2;ctx.stroke();
          ctx.fillStyle='#e5fb9c';ctx.font=`bold ${Math.max(13,scale*.06)}px Work Sans`;
          ctx.fillText(m.type==='land'?'H':'★',x,y);
        }
        (m.obstacles||[]).forEach(o=>{
          const x=px(o.x),y=py(o.y),r=scale*o.r;
          ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle='#ff8b4d39';ctx.fill();
          ctx.strokeStyle='#ff9b5f';ctx.lineWidth=3;ctx.stroke();
          ctx.fillStyle='#ffbd82';ctx.font=`bold ${Math.max(13,r)}px Work Sans`;ctx.fillText('!',x,y);
        });
      }
      const x=px(drone.x),y=py(drone.y),s=Math.max(12,scale*.048);
      ctx.save();ctx.translate(x,y);
      ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(5,9+s*drone.z*.25,s*1.25,s*.62,0,0,Math.PI*2);ctx.fill();
      ctx.rotate(drone.angle);
      ctx.strokeStyle='#b7edf0';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(-s*.78,-s*.78);ctx.lineTo(s*.78,s*.78);ctx.moveTo(s*.78,-s*.78);ctx.lineTo(-s*.78,s*.78);ctx.stroke();
      for(const a of [-1,1])for(const b of [-1,1]){
        ctx.beginPath();ctx.arc(a*s*.8,b*s*.8,s*.36,0,Math.PI*2);
        ctx.strokeStyle='#8be2ea';ctx.lineWidth=2;ctx.stroke();
      }
      ctx.beginPath();ctx.arc(0,0,s*.5,0,Math.PI*2);ctx.fillStyle='#c8f35b';ctx.fill();
      ctx.beginPath();ctx.moveTo(0,-s*.95);ctx.lineTo(-s*.22,-s*.39);ctx.lineTo(s*.22,-s*.39);ctx.fillStyle='#ffffff';ctx.fill();
      ctx.restore();
    }
    function tick(time){
      const dt=Math.min((time-lastTime)/1000||0,.05);lastTime=time;
      if(running){
        const m=missions[level];
        const vx=input.right.x+(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0);
        const vy=input.right.y+(keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0);
        const vz=-input.left.y+(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0);
        drone.z=Math.max(0,Math.min(2,drone.z+vz*dt*.85));
        drone.angle+=input.left.x*dt*2;
        const oldX=drone.x,oldY=drone.y;
        if(drone.z>.18){drone.x+=vx*dt*.32;drone.y+=vy*dt*.4;}
        const boundary=drone.x<.05||drone.x>.95||drone.y<.08||drone.y>.92;
        const hit=(m.obstacles||[]).some(o=>Math.hypot((drone.x-o.x)*cw,(drone.y-o.y)*ch)<Math.min(cw,ch)*(o.r+.035));
        if(boundary||hit){
          drone.x=oldX;drone.y=oldY;
          collisions=Math.min(2,collisions+1);
          drone.x=.3;drone.y=.68;drone.z=0;hoverTime=0;
          $('gameNotice').textContent='앗! 안전하게 출발 지점에서 다시 해요.';
        }
        const near=m.x===undefined?true:Math.hypot((drone.x-m.x)*cw,(drone.y-m.y)*ch)<Math.min(cw,ch)*.09;
        let progress=0, done=false;
        if(m.type==='climb'){progress=drone.z/m.altitude*100;done=drone.z>=m.altitude;}
        else if(m.type==='hover'||m.type==='hoverTarget'){
          if(near&&Math.abs(drone.z-m.altitude)<.22 && Math.hypot(vx,vy)<.32) hoverTime+=dt;
          else hoverTime=Math.max(0,hoverTime-dt*1.2);
          progress=hoverTime/m.seconds*100;done=hoverTime>=m.seconds;
        }else if(m.type==='land'){
          progress=near?Math.max(15,(1-drone.z/1.5)*100):Math.max(0,65-Math.hypot((drone.x-m.x)*cw,(drone.y-m.y)*ch)/Math.min(cw,ch)*90);
          done=near&&drone.z<.2;
        }else{
          const distance=Math.hypot((drone.x-m.x)*cw,(drone.y-m.y)*ch)/Math.min(cw,ch);
          progress=Math.max(0,(1-distance/.8)*100);
          done=near&&drone.z>=m.altitude;
        }
        updateReadouts(progress);
        if(done)finish();
      }
      draw();requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
 </body>
</html>
