<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI 이미지 생성 프롬프트 스튜디오 Pro</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --chip-bg: #f1f5f9;
      --chip-hover: #e2e8f0;
      --chip-active-bg: #eef2ff;
      --chip-active-border: #6366f1;
      --chip-active-text: #4338ca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 60px;
    }

    /* 헤더 */
    header {
      text-align: center;
      padding: 12px 0 6px 0;
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      /* background: var(--primary-gradient); */
      /* -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; */
      -webkit-text-fill-color: #4f46e5;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* 탭 메뉴 (가운데 정렬) */
    .tab-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0;
    }
    .tab-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tab-container {
      display: inline-flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
    }

    .tab-btn {
      padding: 9px 15px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    /* 카드 스타일 */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ? 설명 버튼 */
    .help-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 0.76rem;
      font-weight: 600;
      color: #6366f1;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .help-btn:active {
      transform: scale(0.96);
    }

    /* 입력창 */
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }

    /* 칩 목록 */
    .chips-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 8px 12px;
      background: var(--chip-bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .chip:hover {
      background: var(--chip-hover);
    }

    .chip.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
      border-color: var(--chip-active-border);
      font-weight: 700;
    }

    /* 하단 액션 */
    .result-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-main-group {
      display: flex;
      gap: 8px;
    }

    .btn-complete {
      flex: 3;
      padding: 14px;
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn-complete:active {
      transform: scale(0.99);
    }

    .btn-reset {
      flex: 1;
      padding: 14px;
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-reset:active {
      background: #e2e8f0;
      color: #0f172a;
    }

    .prompt-box {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .prompt-textarea {
      width: 100%;
      height: 160px;
      padding: 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.55;
      resize: vertical;
      outline: none;
      background: #f8fafc;
      color: var(--text-main);
    }
    .prompt-textarea:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1.5px solid var(--border);
      background: #ffffff;
      transition: all 0.15s;
    }

    .btn-translate {
      color: var(--primary);
      border-color: #c7d2fe;
      background: #f5f7ff;
    }
    .btn-copy {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }
    .btn-copy:active {
      background: #1e293b;
    }

    /* 토스트 알림 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 11px 22px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 설명 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 2000;
    }
    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 540px;
      max-height: 82vh;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }

    .modal-body {
      overflow-y: auto;
      padding: 14px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .help-item {
      padding: 11px 13px;
      background: #f8fafc;
      border-radius: 10px;
      border-left: 3.5px solid var(--primary);
    }
    .help-item-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .help-item-desc {
      font-size: 0.83rem;
      color: var(--text-sub);
      margin-top: 3px;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>AI 이미지 생성 프롬프트 스튜디오 Pro</h1>
      <p>Gemini · Midjourney · DALL-E 3 글로벌 프롬프트 빌더</p>
    </header>

    <!-- 1. 상단 탭 (가운데 정렬) -->
    <div class="tab-wrapper">
      <div class="tab-container" id="tabContainer">
        <button class="tab-btn active" data-tab="image">🖼️ 이미지</button>
        <button class="tab-btn" data-tab="poster">📜 포스터</button>
        <button class="tab-btn" data-tab="sticker">✨ 스티커</button>
        <button class="tab-btn" data-tab="travel_map">🗺️ 여행지도</button>
        <button class="tab-btn" data-tab="popup_book">📖 팝업북</button>
      </div>
    </div>

    <!-- 2. 주제 입력 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">💡 1. 주제 (Subject)</span>
      </div>
      <input type="text" id="subjectInput" placeholder="예: 구름 위를 달리는 황금 기차" />
    </div>

    <!-- 3. 스타일 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">🎨 2. 스타일 (Style)</span>
        <button class="help-btn" onclick="openHelp('style')">? 설명</button>
      </div>
      <div class="chips-group" id="styleChips"></div>
    </div>

    <!-- 4. 구도 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">📐 3. 구도 (Composition)</span>
        <button class="help-btn" onclick="openHelp('composition')">? 설명</button>
      </div>
      <div class="chips-group" id="compositionChips"></div>
    </div>

    <!-- 5. 조명 및 색상 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">💡 4. 조명 및 색상 (Lighting & Color)</span>
        <button class="help-btn" onclick="openHelp('lighting')">? 설명</button>
      </div>
      <div class="chips-group" id="lightingChips"></div>
    </div>

    <!-- 6. 화질 및 파라미터 -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">💎 5. 화질 및 글로벌 AI 파라미터 (Quality & Engine)</span>
        <button class="help-btn" onclick="openHelp('quality')">? 설명</button>
      </div>
      <div class="chips-group" id="qualityChips"></div>
    </div>

    <!-- 7. 하단 버튼 및 결과 영역 -->
    <div class="result-section">
      <div class="btn-main-group">
        <button class="btn-complete" id="completeBtn">✨ 프롬프트 완성하기</button>
        <button class="btn-reset" id="resetBtn">🔄 전체 다시 하기</button>
      </div>

      <div class="prompt-box" id="promptBox">
        <textarea class="prompt-textarea" id="promptOutput" spellcheck="false" placeholder="완성된 프롬프트가 여기에 표시됩니다."></textarea>
        <div class="action-group">
          <button class="action-btn btn-translate" id="translateBtn">🌐 영어로 변환 (KO ➔ EN)</button>
          <button class="action-btn btn-copy" id="copyBtn">📋 전체 복사</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 쉬운 용어 설명 모달 -->
  <div class="modal-overlay" id="helpModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">옵션 설명</div>
        <button class="modal-close" onclick="closeHelp()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 토스트 -->
  <div class="toast" id="toast">복사되었습니다!</div>

    // 상태 관리
    let currentTab = "image";
    let isEnglish = false;
    let selectedOptions = {
      style: new Set(),
      composition: new Set(),
      lighting: new Set(),
      quality: new Set()
    };

    // 칩 렌더링 함수
    function renderCategoryChips(category, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      const items = DATA_BY_TAB[currentTab][category] || [];

      items.forEach((item) => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = item.ko;

        if (selectedOptions[category].has(item)) {
          chip.classList.add("active");
        }

        chip.addEventListener("click", () => {
          if (selectedOptions[category].has(item)) {
            selectedOptions[category].delete(item);
            chip.classList.remove("active");
          } else {
            selectedOptions[category].add(item);
            chip.classList.add("active");
          }
        });

        container.appendChild(chip);
      });
    }

    // 모든 칩 갱신
    function updateAllChips() {
      renderCategoryChips("style", "styleChips");
      renderCategoryChips("composition", "compositionChips");
      renderCategoryChips("lighting", "lightingChips");
      renderCategoryChips("quality", "qualityChips");
    }

    // 탭 전환 이벤트 리스너
    const tabBtns = document.querySelectorAll(".tab-btn");
    tabBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.getAttribute("data-tab");

        clearSelections();
        updateAllChips();

        if (document.getElementById("promptBox").style.display === "flex") {
          document.getElementById("promptOutput").value = buildPrompt(isEnglish);
        }
      });
    });

    // 선택 초기화 함수
    function clearSelections() {
      selectedOptions.style.clear();
      selectedOptions.composition.clear();
      selectedOptions.lighting.clear();
      selectedOptions.quality.clear();
    }

    // 프롬프트 생성 빌더
    function buildPrompt(toEnglish = false) {
      const subject = document.getElementById("subjectInput").value.trim();
      const lang = toEnglish ? "en" : "ko";
      const parts = [];

      // 1. 기본 탭 템플릿
      parts.push(DATA_BY_TAB[currentTab].template[lang]);

      // 2. 주제
      if (subject) {
        if (toEnglish) {
          parts.push(`Subject: ${subject}`);
        } else {
          parts.push(`주제: ${subject}`);
        }
      }

      // 3. 각 카테고리별 선택 옵션
      const styleList = Array.from(selectedOptions.style).map((i) => i[lang]);
      const compList = Array.from(selectedOptions.composition).map((i) => i[lang]);
      const lightList = Array.from(selectedOptions.lighting).map((i) => i[lang]);
      const qualList = Array.from(selectedOptions.quality).map((i) => i[lang]);

      if (styleList.length > 0) parts.push(toEnglish ? `Style: ${styleList.join(", ")}` : `스타일: ${styleList.join(", ")}`);
      if (compList.length > 0) parts.push(toEnglish ? `Composition: ${compList.join(", ")}` : `구도: ${compList.join(", ")}`);
      if (lightList.length > 0) parts.push(toEnglish ? `Lighting & Color: ${lightList.join(", ")}` : `조명 및 색상: ${lightList.join(", ")}`);
      if (qualList.length > 0) parts.push(toEnglish ? `Quality & Parameters: ${qualList.join(", ")}` : `화질 및 파라미터: ${qualList.join(", ")}`);

      return parts.join(toEnglish ? ", " : ",\n");
    }

    // [프롬프트 완성하기] 버튼
    const completeBtn = document.getElementById("completeBtn");
    const promptBox = document.getElementById("promptBox");
    const promptOutput = document.getElementById("promptOutput");
    const translateBtn = document.getElementById("translateBtn");

    completeBtn.addEventListener("click", () => {
      isEnglish = false;
      translateBtn.textContent = "🌐 영어로 변환 (KO ➔ EN)";
      promptOutput.value = buildPrompt(false);
      promptBox.style.display = "flex";
      promptBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    // [전체 다시 하기] 버튼
    const resetBtn = document.getElementById("resetBtn");
    resetBtn.addEventListener("click", () => {
      document.getElementById("subjectInput").value = "";
      clearSelections();
      updateAllChips();
      promptOutput.value = "";
      promptBox.style.display = "none";
      isEnglish = false;
      showToast("모든 설정이 초기화되었습니다.");
    });

    // [한/영 변환] 버튼
    translateBtn.addEventListener("click", () => {
      isEnglish = !isEnglish;
      promptOutput.value = buildPrompt(isEnglish);
      translateBtn.textContent = isEnglish
        ? "🌐 한글로 변환 (EN ➔ KO)"
        : "🌐 영어로 변환 (KO ➔ EN)";
    });

    // [전체 복사] 버튼
    const copyBtn = document.getElementById("copyBtn");
    const toast = document.getElementById("toast");

    copyBtn.addEventListener("click", async () => {
      const text = promptOutput.value;
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
        showToast("프롬프트가 클립보드에 복사되었습니다! 🎉");
      } catch (err) {
        promptOutput.select();
        document.execCommand("copy");
        showToast("프롬프트가 복사되었습니다! 🎉");
      }
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    // [? 설명 모달]
    const helpModal = document.getElementById("helpModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");

    const categoryNames = {
      style: "스타일 (Style)",
      composition: "구도 (Composition)",
      lighting: "조명 및 색상 (Lighting & Color)",
      quality: "화질 및 글로벌 AI 파라미터 (Quality & Engine)"
    };

    function openHelp(category) {
      modalTitle.textContent = `💡 ${categoryNames[category]} 쉬운 설명`;
      modalBody.innerHTML = "";

      const items = DATA_BY_TAB[currentTab][category] || [];
      items.forEach((item) => {
        const div = document.createElement("div");
        div.className = "help-item";
        div.innerHTML = `
          <div class="help-item-title">${item.ko}</div>
          <div class="help-item-desc">${item.desc}</div>
        `;
        modalBody.appendChild(div);
      });

      helpModal.classList.add("active");
    }

    function closeHelp() {
      helpModal.classList.remove("active");
    }

    helpModal.addEventListener("click", (e) => {
      if (e.target === helpModal) closeHelp();
    });

    // 초기 실행
    updateAllChips();
  </script>
</body>
</html>
