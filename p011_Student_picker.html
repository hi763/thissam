<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>우리 반 뽑기 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1f3b30;
    --board-dark:#132720;
    --chalk:#f5f0e6;
    --chalk-dim:#c9d6cd;
    --yellow:#f2c14e;
    --coral:#ef767a;
    --blue:#7fb7be;
    --purple:#b892ff;
    --mint:#8fd694;
    --paper:#faf6ec;
    --paper-line:#e7ddc5;
  }

  *{box-sizing:border-box;}

  html,body{ margin:0; padding:0; min-height:100%; }

  body{
    font-family:'Nanum Gothic', sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.035) 0, transparent 35%),
      radial-gradient(circle at 85% 75%, rgba(255,255,255,0.03) 0, transparent 40%),
      radial-gradient(circle at 60% 10%, rgba(255,255,255,0.02) 0, transparent 30%),
      linear-gradient(160deg, var(--board) 0%, var(--board-dark) 100%);
    color:var(--chalk);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.5;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.15) 0, transparent 100%),
      radial-gradient(1px 1px at 70% 65%, rgba(255,255,255,0.12) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,0.1) 0, transparent 100%),
      radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,0.12) 0, transparent 100%),
      radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.08) 0, transparent 100%);
    background-size: 400px 400px;
  }

  .wrap{ width:100%; max-width:560px; position:relative; z-index:1; }

  .hero{ text-align:center; margin-bottom:22px; }

  .hero .eyebrow{
    font-family:'Gaegu', sans-serif;
    font-size:15px;
    color:var(--yellow);
    letter-spacing:2px;
    display:inline-block;
    padding:4px 14px;
    border:1.5px dashed rgba(242,193,78,0.55);
    border-radius:999px;
    margin-bottom:14px;
  }

  .hero h1{
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size:clamp(30px, 8vw, 44px);
    margin:0 0 8px;
    text-shadow: 0 0 14px rgba(245,240,230,0.25);
    letter-spacing:1px;
  }

  .hero p{ margin:0; color:var(--chalk-dim); font-size:15px; }

  .board-frame{
    position:relative;
    border-radius:18px;
    padding:3px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.04);
  }

  .card{
    background: rgba(255,255,255,0.03);
    border:2px dashed rgba(245,240,230,0.35);
    border-radius:16px;
    padding:26px 22px 24px;
  }

  .field{ margin-bottom:18px; }

  label{
    display:block;
    font-family:'Gaegu', sans-serif;
    font-size:17px;
    color:var(--yellow);
    margin-bottom:7px;
  }

  input[type="number"], input[type="text"]{
    width:100%;
    background:var(--paper);
    color:#2a2a24;
    border:none;
    border-radius:10px;
    padding:12px 14px;
    font-size:16px;
    font-family:'Nanum Gothic', sans-serif;
    font-weight:700;
    outline:none;
    box-shadow: inset 0 0 0 2px transparent, 0 2px 0 rgba(0,0,0,0.15);
    transition: box-shadow 0.15s ease;
  }

  input:focus{ box-shadow: inset 0 0 0 2px var(--blue), 0 2px 0 rgba(0,0,0,0.15); }
  input::placeholder{ color:#8a8a7a; font-weight:400; }

  .name-counter{
    margin-top:7px;
    font-size:13px;
    color:var(--chalk-dim);
  }
  .name-counter b{ color:var(--mint); }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:14px 0 20px;
  }

  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--paper);
    color:#2a2a24;
    font-weight:700;
    font-size:14px;
    padding:6px 8px 6px 12px;
    border-radius:999px;
    box-shadow:0 2px 0 rgba(0,0,0,0.18);
    animation: pop-in 0.18s ease;
  }

  .chip.picked{
    background:var(--chalk-dim);
    color:#4a4a3f;
    opacity:0.55;
    text-decoration:line-through;
  }

  .chip button{
    border:none;
    background:rgba(0,0,0,0.12);
    color:#2a2a24;
    width:18px; height:18px;
    border-radius:50%;
    font-size:12px; line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-weight:800;
  }
  .chip button:hover{ background:rgba(0,0,0,0.25); }

  @keyframes pop-in{
    from{ transform:scale(0.6); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }

  .btn-primary{
    width:100%;
    border:none;
    border-radius:12px;
    background:var(--yellow);
    color:#28230b;
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size:20px;
    padding:14px;
    cursor:pointer;
    box-shadow:0 5px 0 #b58f2b, 0 10px 18px rgba(0,0,0,0.35);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    letter-spacing:1px;
  }
  .btn-primary:active{ transform:translateY(4px); box-shadow:0 1px 0 #b58f2b, 0 4px 10px rgba(0,0,0,0.35); }
  .btn-primary:disabled{ opacity:0.45; cursor:not-allowed; box-shadow:none; transform:none; }

  .hint{
    font-size:13px;
    color:var(--coral);
    text-align:center;
    min-height:18px;
    margin:10px 0 0;
    font-weight:700;
  }

  /* ---------- draw screen ---------- */

  .draw-screen{ text-align:center; }

  .draw-eyebrow{
    font-family:'Gaegu', sans-serif;
    font-size:16px;
    color:var(--mint);
    letter-spacing:1px;
    margin-bottom:14px;
  }

  .winner-jar{
    position:relative;
    background:var(--paper);
    border-radius:6px 6px 16px 16px;
    padding:44px 20px 36px;
    box-shadow: 0 20px 40px -12px rgba(0,0,0,0.55), 0 2px 0 rgba(0,0,0,0.1) inset;
    margin-bottom:18px;
  }

  .winner-jar::before{
    content:"";
    position:absolute;
    top:-10px;
    left:50%;
    transform:translateX(-50%);
    width:18px; height:18px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, #999 60%, #555 100%);
    box-shadow:0 2px 5px rgba(0,0,0,0.4);
  }

  #winnerDisplay{
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size:clamp(40px, 13vw, 68px);
    color:#26261f;
    line-height:1.1;
    word-break:keep-all;
    min-height:1.2em;
  }

  #winnerDisplay.reveal-pulse{
    animation: pulse-reveal 0.45s ease;
  }

  @keyframes pulse-reveal{
    0%{ transform:scale(0.85); }
    55%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }

  .remaining-info{
    font-size:14px;
    color:var(--chalk-dim);
    margin-bottom:14px;
  }
  .remaining-info b{ color:var(--yellow); }

  .history-label{
    font-family:'Gaegu', sans-serif;
    font-size:15px;
    color:var(--chalk-dim);
    text-align:left;
    margin:6px 0 8px;
  }

  .history-chips{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    justify-content:flex-start;
    margin-bottom:22px;
    min-height:0;
  }

  .history-chip{
    background:var(--purple);
    color:#2a2044;
    font-weight:800;
    font-size:13px;
    padding:5px 11px;
    border-radius:999px;
    animation: pop-in 0.2s ease;
  }

  .button-stack{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .btn-continue{
    border:none;
    border-radius:12px;
    background:var(--blue);
    color:#0e2b2e;
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size:19px;
    padding:13px;
    cursor:pointer;
    box-shadow:0 4px 0 #4f8b91, 0 8px 16px rgba(0,0,0,0.35);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .btn-continue:active{ transform:translateY(4px); box-shadow:0 1px 0 #4f8b91; }
  .btn-continue:disabled{ opacity:0.4; cursor:not-allowed; box-shadow:none; transform:none; }

  .row-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .btn-secondary{
    border:1.5px dashed rgba(245,240,230,0.5);
    background:transparent;
    color:var(--chalk);
    font-family:'Gaegu', sans-serif;
    font-size:16px;
    padding:11px;
    border-radius:12px;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  .btn-secondary:hover{ background:rgba(255,255,255,0.08); }

  .btn-danger{
    border:1.5px dashed rgba(239,118,122,0.6);
    color:var(--coral);
  }

  .draw-hint{
    font-size:13px;
    color:var(--yellow);
    text-align:center;
    min-height:18px;
    margin:14px 0 0;
    font-weight:700;
  }

  .hidden{ display:none !important; }

  @media (max-width:420px){
    .card{ padding:20px 16px; }
    .winner-jar{ padding:34px 16px 28px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ===== 설정 화면 ===== -->
  <div id="setup-screen">
    <div class="hero">
      <span class="eyebrow">TODAY'S ROLL CALL · 오늘의 뽑기</span>
      <h1>우리 반 뽑기 도우미</h1>
      <p>학생 수와 이름을 입력하고 뽑기를 시작해보세요.</p>
    </div>

    <div class="board-frame">
      <div class="card">

        <div class="field">
          <label for="totalStudents">전체 학생 수</label>
          <input type="number" id="totalStudents" min="1" value="20" inputmode="numeric">
        </div>

        <div class="field name-field">
          <label for="nameInput">학생 이름 (입력 후 Enter)</label>
          <input type="text" id="nameInput" placeholder="이름 입력 후 Enter, 또는 여러 명을 한번에 붙여넣기">
          <div class="name-counter"><b id="nameCount">0</b> / <span id="totalCount">20</span>명 입력됨 · 나머지는 번호로 채워져요</div>
          <div class="name-counter">쉼표(,) · 공백 · 줄바꿈으로 구분된 이름 목록을 그대로 붙여넣어도 인식돼요</div>
        </div>

        <div class="chips" id="nameChips"></div>

        <button class="btn-primary" id="drawBtn">뽑기</button>
        <p class="hint" id="errorHint">&nbsp;</p>
      </div>
    </div>
  </div>

  <!-- ===== 뽑기 결과 화면 ===== -->
  <div id="draw-screen" class="draw-screen hidden">
    <div class="draw-eyebrow" id="drawOrdinal">1번째 뽑기</div>

    <div class="winner-jar">
      <div id="winnerDisplay">-</div>
    </div>

    <div class="remaining-info">남은 학생 <b id="remainingCount">0</b>명</div>

    <div class="history-label">지금까지 뽑힌 학생</div>
    <div class="history-chips" id="historyChips"></div>

    <div class="button-stack">
      <button class="btn-continue" id="continueDrawBtn">계속 뽑기</button>
      <div class="row-2">
        <button class="btn-secondary" id="redoBtn">다시하기</button>
        <button class="btn-secondary btn-danger" id="resetBtn">초기화</button>
      </div>
    </div>

    <p class="draw-hint" id="drawHint">&nbsp;</p>
  </div>

</div>

<script>
(function(){
  const totalStudentsInput = document.getElementById('totalStudents');
  const nameInput = document.getElementById('nameInput');
  const nameChips = document.getElementById('nameChips');
  const nameCountEl = document.getElementById('nameCount');
  const totalCountEl = document.getElementById('totalCount');
  const drawBtn = document.getElementById('drawBtn');
  const errorHint = document.getElementById('errorHint');

  const setupScreen = document.getElementById('setup-screen');
  const drawScreen = document.getElementById('draw-screen');

  const winnerDisplay = document.getElementById('winnerDisplay');
  const drawOrdinal = document.getElementById('drawOrdinal');
  const remainingCountEl = document.getElementById('remainingCount');
  const historyChips = document.getElementById('historyChips');
  const continueDrawBtn = document.getElementById('continueDrawBtn');
  const redoBtn = document.getElementById('redoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const drawHint = document.getElementById('drawHint');

  let names = [];
  let roster = [];
  let remainingPool = [];
  let drawnHistory = [];
  let animating = false;

  function currentTotal(){
    const v = parseInt(totalStudentsInput.value, 10);
    return Number.isFinite(v) && v > 0 ? v : 0;
  }

  function updateCounter(){
    nameCountEl.textContent = names.length;
    totalCountEl.textContent = currentTotal();
  }

  function renderChips(){
    nameChips.innerHTML = '';
    names.forEach((name, idx) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const label = document.createElement('span');
      label.textContent = name;
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', name + ' 삭제');
      removeBtn.addEventListener('click', () => {
        names.splice(idx, 1);
        renderChips();
        updateCounter();
      });
      chip.appendChild(label);
      chip.appendChild(removeBtn);
      nameChips.appendChild(chip);
    });
    updateCounter();
  }

  totalStudentsInput.addEventListener('input', updateCounter);

  // 쉼표(,) / 공백 / 줄바꿈으로 구분된 텍스트를 한번에 이름 목록으로 추가
  function addNamesFromText(text){
    const tokens = text.split(/[,\n\r\t]+|\s+/).map(s => s.trim()).filter(Boolean);
    if(tokens.length === 0) return;

    const total = currentTotal();
    let overflow = false;

    tokens.forEach(tok => {
      if(total > 0 && names.length >= total){
        overflow = true;
        return;
      }
      names.push(tok);
    });

    nameInput.value = '';
    renderChips();

    if(overflow){
      errorHint.textContent = '전체 학생 수를 넘는 이름은 추가되지 않았어요. 전체 학생 수를 확인해주세요.';
    } else {
      errorHint.textContent = '\u00A0';
    }
  }

  // 메모장 등에서 이름 목록을 통째로 붙여넣기 했을 때 처리
  nameInput.addEventListener('paste', (e) => {
    const clipboard = e.clipboardData || window.clipboardData;
    if(!clipboard) return;
    const text = clipboard.getData('text');
    if(!text || !/[,\n\r\s]/.test(text.trim())){
      // 이름 하나만 붙여넣은 경우는 기본 붙여넣기 동작에 맡김
      return;
    }
    e.preventDefault();
    addNamesFromText(text);
  });

  nameInput.addEventListener('keydown', (e) => {
    if(e.key !== 'Enter') return;
    e.preventDefault();
    const val = nameInput.value.trim();
    if(!val) return;
    addNamesFromText(val);
  });

  function buildRoster(){
    const total = currentTotal();
    const list = [];
    for(let i = 0; i < total; i++){
      list.push(names[i] ? names[i] : String(i + 1));
    }
    return list;
  }

  function renderHistory(){
    historyChips.innerHTML = '';
    drawnHistory.forEach((name, idx) => {
      const chip = document.createElement('span');
      chip.className = 'history-chip';
      chip.textContent = (idx + 1) + '. ' + name;
      historyChips.appendChild(chip);
    });
    remainingCountEl.textContent = remainingPool.length;
  }

  function cycleAndReveal(finalName, poolIdx){
    animating = true;
    continueDrawBtn.disabled = true;
    drawHint.textContent = '\u00A0';

    const flavorPool = roster.length ? roster : [finalName];
    let step = 0;
    const totalSteps = 16;

    function tick(){
      if(step < totalSteps){
        const randomName = flavorPool[Math.floor(Math.random() * flavorPool.length)];
        winnerDisplay.textContent = randomName;
        step++;
        const delay = 45 + step * 9;
        setTimeout(tick, delay);
      } else {
        winnerDisplay.textContent = finalName;
        winnerDisplay.classList.remove('reveal-pulse');
        void winnerDisplay.offsetWidth;
        winnerDisplay.classList.add('reveal-pulse');

        remainingPool.splice(poolIdx, 1);
        drawnHistory.push(finalName);
        drawOrdinal.textContent = drawnHistory.length + '번째 뽑기';
        renderHistory();

        animating = false;
        if(remainingPool.length === 0){
          continueDrawBtn.disabled = true;
          drawHint.textContent = '모든 학생이 뽑혔어요! 🎊';
        } else {
          continueDrawBtn.disabled = false;
        }
      }
    }
    tick();
  }

  function performDraw(){
    if(animating) return;
    if(remainingPool.length === 0){
      drawHint.textContent = '모든 학생이 뽑혔어요! 🎊';
      continueDrawBtn.disabled = true;
      return;
    }
    const idx = Math.floor(Math.random() * remainingPool.length);
    const target = remainingPool[idx];
    cycleAndReveal(target, idx);
  }

  drawBtn.addEventListener('click', () => {
    const total = currentTotal();
    if(total < 1){
      errorHint.textContent = '전체 학생 수를 올바르게 입력해주세요.';
      return;
    }
    errorHint.textContent = '\u00A0';

    roster = buildRoster();
    remainingPool = roster.slice();
    drawnHistory = [];

    setupScreen.classList.add('hidden');
    drawScreen.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });

    performDraw();
  });

  continueDrawBtn.addEventListener('click', performDraw);

  redoBtn.addEventListener('click', () => {
    if(animating) return;
    remainingPool = roster.slice();
    drawnHistory = [];
    renderHistory();
    performDraw();
  });

  resetBtn.addEventListener('click', () => {
    if(animating) return;
    names = [];
    roster = [];
    remainingPool = [];
    drawnHistory = [];
    nameInput.value = '';
    totalStudentsInput.value = 20;
    renderChips();
    errorHint.textContent = '\u00A0';
    winnerDisplay.textContent = '-';
    historyChips.innerHTML = '';
    drawHint.textContent = '\u00A0';

    drawScreen.classList.add('hidden');
    setupScreen.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  renderChips();
})();
</script>

</body>
</html>
