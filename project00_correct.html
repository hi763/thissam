<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정답</title>
<style>
  html, body{
    margin:0;
    padding:0;
    height:100%;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  video{
    max-width:100%;
    max-height:100vh;
    width:auto;
    height:auto;
  }
</style>
</head>
<body>

  <!--
    아래 src="video.mp4" 부분을 실제 동영상 파일명으로 바꿔주세요.
    동영상 파일은 이 html 파일과 같은 폴더(또는 GitHub 저장소)에 함께 올려야 합니다.
    예) src="my-video.mp4"
  -->
  <video id="video" src="correct.mp4" autoplay playsinline></video>

  <script>
    const video = document.getElementById('video');

    // 소리 포함 자동재생 시도
    video.play().catch(() => {
      // 브라우저가 소리 있는 자동재생을 막은 경우,
      // 화면을 처음 클릭/터치하는 순간 소리와 함께 재생 시작
      const startWithSound = () => {
        video.muted = false;
        video.play();
        document.removeEventListener('click', startWithSound);
        document.removeEventListener('touchstart', startWithSound);
      };
      document.addEventListener('click', startWithSound);
      document.addEventListener('touchstart', startWithSound);
    });
  </script>

</body>
</html>
