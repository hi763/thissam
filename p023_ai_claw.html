<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   AI 마법의 인형 뽑기 V1.3
  </title>
  <style>

* {
    box-sizing: border-box;
   
}
body {
    margin: 0;
    background: linear-gradient(125deg,#fff3b8,#ffe0f2,#d9faff);
    color:#34305d;
    font: bold 17px system-ui,sans-serif;
   
}
header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 20px;
    gap:10px;
    flex-wrap:wrap;
   
}
h1 {
    font-size:clamp(22px,4vw,36px);
    margin:0;
    color:#7139b5;
   
}
button, select {
    font:inherit;
    border:0;
    border-radius:14px;
    padding:12px;
    background:white;
    color:#49316c;
    cursor:pointer;
    touch-action:manipulation;
   
}
button:focus-visible {
    outline:4px solid #1268ab;
   
}
button.active, #grab {
    background:#773bd0;
    color:white;
   
}
main {
    display:grid;
    grid-template-columns:minmax(0,2.2fr) minmax(290px,1fr);
    gap:15px;
    padding:0 16px 16px;
   
}
.machine {
    background:linear-gradient(145deg,#ff83c3,#b995ff);
    border:7px solid #fff;
    border-radius:28px;
    padding:12px;
    box-shadow:0 7px #d895df;
    align-self:start;
   
}
.sign {
    text-align:center;
    background:#fff29a;
    border-radius:14px;
    padding:8px;
    font-size:23px;
    color:#753d9e;
   
}
#game {
    width:100%;
    display:block;
    background:#d9faff;
    border:5px solid white;
    border-radius:15px;
    margin:10px 0;
    aspect-ratio:800/470;
    touch-action:none;
   
}
.controls {
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
   
}
.controls button {
    min-width:55px;
    font-size:25px;
    touch-action:none;
   
}
aside {
    background:#fff;
    border-radius:22px;
    padding:15px;
   
}
#collection {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    font-size:32px;
   
}
#collection span {
    text-align:center;
    background:#f4eaff;
    border-radius:10px;
    min-height:48px;
   
}
#status {
    font-size:14px;
    line-height:1.5;
   
}
#camera {
    position:relative;
    background:#222;
    border-radius:12px;
    overflow:hidden;
   
}
#camera[hidden] {
    display:none;
   
}
#video {
    width:100%;
    display:block;
    transform:scaleX(-1);
   
}
#overlay {
    display:block;
    z-index:2;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    transform:scaleX(-1);
   
}
.modes {
    display:flex;
    flex-wrap:wrap;
    gap:6px;
   
}
.modes button {
    background:#e9ddff;
    font-size:15px;
   
}
.modes button.active {
    background:#773bd0;
   
}
dialog {
    border:0;
    border-radius:20px;
    max-width:90vw;
    color:inherit;
   
}
dialog label {
    display:block;
    margin:15px 0;
   
}
input[type=range] {
    width:100%;
   
}
#message {
    min-height:35px;
    text-align:center;
    font-size:22px;
   
}
small {
    font-weight:normal;
   
}
.guide {
    background:#fff4c8;
    border-radius:12px;
    padding:12px;
    line-height:1.65;
    font-size:15px;
    margin-top:8px;
   
}
.guide strong {
    display:block;
    color:#7139b5;
   
}
#tracking {
    background:#fff0c2;
    padding:10px;
    border-radius:10px;
    font-size:15px;
   
}
#tracking[data-state="ok"] {
    background:#c9f8df;
    color:#145c39;
   
}
#tracking[data-state="grab"] {
    background:#e8d4ff;
    color:#5b239a;
   
}
#score {
    font-size:17px;
   
}
@media(max-width:720px) {
    main {
    grid-template-columns:1fr;
   
}
}
</style>
 </head>
 <body>
  <header>
   <h1>
    🧸 AI 마법의 인형 뽑기 V1.3
   </h1>
   <div>
    <button id="full">
     ⛶ 전체 화면
    </button>
    <button id="settings">
     ⚙ 선생님 설정
    </button>
   </div>
  </header>
  <main>
   <section class="machine">
    <div class="sign">

     </button>

     </button>
     <button aria-label="뒤쪽" data-dir="down">
      ↓
     </button>
     <button aria-label="오른쪽" data-dir="right">
      →
     </button>
    </div>
   </section>
   <aside>
    <div class="modes">
     <button class="active" id="manual">
      터치 / PC
     </button>
     <button id="hand">
      AI 손 인식
     </button>
     <button id="pose">
      AI 신체 인식
     </button>
     <button id="cube">
      G큐브 (준비 중)
     </button>
    </div>
    <div class="guide" id="guide">
    </div>
    <p id="status" role="status">

    </p>
    <div id="camera" hidden>
      <video autoplay muted playsinline id="video"></video>
      <canvas id="overlay"></canvas>
    </div>
    <p id="tracking" role="status">
     터치 조작 준비 완료
    </p>
    <h2>
     🎁 내 인형 보관함
     <span id="score">
      0/9
     </span>
    </h2>
    <div id="collection">
    </div>
    <button id="reset">
     다시 시작
    </button>
    <p>
     <small>
      카메라 영상은 기기에서 분석하며 저장하거나 전송하지 않습니다. AI 모델 다운로드에는 인터넷이 필요합니다.
     </small>
    </p>
   </aside>
  </main>
  <dialog id="dialog">
   <h2>
    선생님 설정
   </h2>
   <label>
    움직임 속도 / 감도
    <input id="speed" max="10" min="1" type="range" value="5"/>
   </label>
   <label>
    <input checked="" id="assist" type="checkbox"/>
    성공 도움 (가장 가까운 인형)
   </label>
   <label>
    <input id="auto" type="checkbox"/>
    자동 뽑기 (2초 정지)
   </label>
   <label>
    <input id="sound" type="checkbox"/>
    효과음
   </label>
   <label>
    인형 테마
    <select id="theme">
     <option value="animals">
      동물
     </option>
     <option value="sea">
      바다
     </option>
     <option value="dino">
      공룡
     </option>
     <option value="fruit">
      과일
     </option>
     <option value="cars">
      자동차
     </option>
    </select>
   </label>
   <button id="close">
    닫기
   </button>
  </dialog>
  <script type="module">
   const $ = id => document.getElementById(id), c = $('game'), ctx = c.getContext('2d');
const themes = { animals: ['🧸', '🐰', '🐶', '🐱', '🐼', '🦊', '🐨', '🐸', '🐵'], sea: ['🐬', '🐳', '🐙', '🐠', '🦀', '🐢', '🦈', '🐡', '🦭'], dino: ['🦖', '🦕', '🐉', '🥚', '🦖', '🦕', '🐊', '🦎', '🐲'], fruit: ['🍎', '🍊', '🍓', '🍇', '🍉', '🍌', '🍐', '🍒', '🍍'], cars: ['🚗', '🚕', '🚙', '🚓', '🚒', '🚑', '🚌', '🚜', '🚚'] };
let toys = [], x = 400, y = 235, held = new Set(), anim = null, mode = 'manual', stream = null, model = null, token = 0, lastVideo = -1, gesture = false, stable = 0, prevX = x, prevY = y, autoLock = false, audio = null;

for (const b of document.querySelectorAll('[data-dir]')) {

        return;
    stop();
    select('manual');
    $('status').textContent = 'AI 연결 실패: ' + e.message + ' — 터치 모드를 사용해 주세요.';
} }
// 카메라 영상과 동일한 좌표계에 관절 점과 연결선을 표시합니다.
const handEdges = [
    [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12], [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17]
];
const poseEdges = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24]];
const overlay = $('overlay');
const oc = overlay.getContext('2d');
let fistFrames = 0;
let openFrames = 0;
let armed = false;
function clearOverlay() {
    oc.clearRect(0,0,overlay.width,overlay.height);
    fistFrames = 0;
    openFrames = 0;
    armed = false;
}
function paintLandmarks(p, m, closed) {
    const video = $('video');
    if (overlay.width !== video.videoWidth || overlay.height !== video.videoHeight) {
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
    }
    oc.clearRect(0,0,overlay.width,overlay.height);
    if (!p) return;
    // 손 모델의 visibility는 유효한 신뢰도 값이 아닐 수 있습니다.
    // 손은 유한한 좌표인지 확인하고, 신체만 가시성을 검사합니다.
    const visible = i => {
        const point = p[i];
        return point && Number.isFinite(point.x) && Number.isFinite(point.y)
            && (m === 'hand' || (point.visibility ?? 1) > .45);
    };
    oc.strokeStyle = closed ? '#ffdc45' : '#35ffae';
    oc.lineWidth = 6;
    oc.lineCap = 'round';
    for (const [a,b] of m === 'hand' ? handEdges : poseEdges) {
        if (!visible(a) || !visible(b)) continue;
        oc.beginPath();
        oc.moveTo(p[a].x*overlay.width,p[a].y*overlay.height);
        oc.lineTo(p[b].x*overlay.width,p[b].y*overlay.height);
        oc.stroke();
    }
    for (let i=0; i<p.length; i++) {
        if (!visible(i)) continue;
        oc.beginPath();
        oc.arc(p[i].x*overlay.width,p[i].y*overlay.height,7,0,Math.PI*2);
        oc.fillStyle = '#fff';
        oc.fill();
        oc.strokeStyle = '#a03aff';
        oc.lineWidth = 2;
        oc.stroke();
    }
}
// 손가락 관절 각도로 접힌 손가락을 판별합니다.
function fingerAngle(a,b,c) {
    const u = [a.x-b.x,a.y-b.y,a.z-b.z];
    const v = [c.x-b.x,c.y-b.y,c.z-b.z];
    const dot = u.reduce((sum,n,i)=>sum+n*v[i],0);
    return Math.acos(Math.max(-1,Math.min(1,dot/(Math.hypot(...u)*Math.hypot(...v)||1))))*180/Math.PI;
}
function track(id, m) {
    if (id !== token || !model) return;
    try {
        const video = $('video');
        if (video.readyState >= 2 && video.currentTime !== lastVideo) {
            lastVideo = video.currentTime;
            const r = model.detectForVideo(video, performance.now());
            const p = r.landmarks?.[0];
            if (p) {
                const q = m === 'hand' ? p[9] : p[16];
                const w = r.worldLandmarks?.[0] || p;
                const folded = m === 'hand' ? [5,9,13,17].filter(i => fingerAngle(w[i],w[i+1],w[i+3]) < 125).length : 0;
                const g = m === 'hand' ? folded >= 3 : p[15].y < p[11].y-.05 && (p[15].visibility ?? 1) > .5;
                const open = m === 'hand' ? folded <= 1 : !g;
                paintLandmarks(p,m,g);
                if (!$('dialog').open) {
                    openFrames = !g ? openFrames+1 : 0;
                    fistFrames = g ? fistFrames+1 : 0;
                    if (openFrames >= 3) armed = true;
                    // 주먹이 아닌 손은 이동 허용: 완전히 펼치기 어려운 학생도 조작 가능.
                    if (!anim && !g && Number.isFinite(q.x) && Number.isFinite(q.y)
                        && (m === 'hand' || (q.visibility ?? 1) > .5)) {
                        const gain = Number($('speed').value)/5;
                        const tx = 400+(.5-q.x)*1200*gain;
                        const ty = 325+(q.y-.5)*650*gain;
                        x += (Math.max(65,Math.min(735,tx))-x)*.30;
                        y += (Math.max(220,Math.min(425,ty))-y)*.30;
                    }
                    if (fistFrames >= 3 && armed && !anim) {
                        armed = false;
                        grab();
                    }
                } else {
                    armed = false;
                    openFrames = fistFrames = 0;
                }
                $('tracking').dataset.state = g ? 'grab' : 'ok';
                $('tracking').textContent = m === 'hand' ? (g ? '✊ 주먹 인식 · 뽑기 동작' : open ? '✋ 손바닥 인식 · 이동 가능' : '손 인식 · 이동 가능') : (g ? '왼손 올림 · 뽑기 동작' : '신체 인식 · 오른손으로 이동');
                $('tracking').textContent += ` | 관절 ${p.length}개 · X ${q.x.toFixed(2)} / Y ${q.y.toFixed(2)}`;
            } else {
                clearOverlay();
                $('tracking').dataset.state = '';
                $('tracking').textContent = m === 'hand' ? '손을 찾는 중 · 밝은 곳에서 손 전체를 보여 주세요' : '몸을 찾는 중 · 양쪽 어깨와 손을 보여 주세요';
            }
        }
    } catch(e) {
        stop();
        select('manual');
        $('status').textContent = '인식 오류: '+e.message;
        return;
    }
    requestAnimationFrame(()=>track(id,m));
}
$('hand').onclick = () => start('hand');
$('pose').onclick = () => start('pose');
window.addEventListener('pagehide', stop);

  </script>
