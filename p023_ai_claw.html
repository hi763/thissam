<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   AI 마법의 인형 뽑기 V2.0
  </title>
  <style>

* {
    box-sizing: border-box;
   
}
body {
    margin: 0;
    background: linear-gradient(125deg,#fff3b8,#ffe0f2,#d9faff);
    color:#34305d;
    font: bold 17px system-ui,sans-serif;
   
}
header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 20px;
    gap:10px;
    flex-wrap:wrap;
   
}
h1 {
    font-size:clamp(22px,4vw,36px);
    margin:0;
    color:#7139b5;
   
}
button, select {
    font:inherit;
    border:0;
    border-radius:14px;
    padding:12px;
    background:white;
    color:#49316c;
    cursor:pointer;
    touch-action:manipulation;
   
}
button:focus-visible {
    outline:4px solid #1268ab;
   
}
button.active, #grab {
    background:#773bd0;
    color:white;
   
}
main {
    display:grid;
    grid-template-columns:minmax(0,2.2fr) minmax(290px,1fr);
    gap:15px;
    padding:0 16px 16px;
   
}
.machine {
    background:linear-gradient(145deg,#ff83c3,#b995ff);
    border:7px solid #fff;
    border-radius:28px;
    padding:12px;
    box-shadow:0 7px #d895df;
    align-self:start;
   
}
.sign {
    text-align:center;
    background:#fff29a;
    border-radius:14px;
    padding:8px;
    font-size:23px;
    color:#753d9e;
   
}
#game {
    width:100%;
    display:block;
    background:#d9faff;
    border:5px solid white;
    border-radius:15px;
    margin:10px 0;
    aspect-ratio:800/470;
    touch-action:none;
   
}
.controls {
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
   
}
.controls button {
    min-width:55px;
    font-size:25px;
    touch-action:none;
   
}
aside {
    background:#fff;
    border-radius:22px;
    padding:15px;
   
}
#collection {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    font-size:32px;
   
}
#collection span {
    text-align:center;
    background:#f4eaff;
    border-radius:10px;
    min-height:48px;
   
}
#status {
    font-size:14px;
    line-height:1.5;
   
}
#camera {
    position:relative;
    background:#222;
    border-radius:12px;
    overflow:hidden;
   
}
#camera[hidden] {
    display:none;
   
}
#video {
    width:100%;
    display:block;
    transform:scaleX(-1);
   
}
#overlay {
    display:block;
    z-index:2;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    transform:scaleX(-1);
   
}
.modes {
    display:flex;
    flex-wrap:wrap;
    gap:6px;
   
}
.modes button {
    background:#e9ddff;
    font-size:15px;
   
}
.modes button.active {
    background:#773bd0;
   
}
dialog {
    border:0;
    border-radius:20px;
    max-width:90vw;
    color:inherit;
   
}
dialog label {
    display:block;
    margin:15px 0;
   
}
input[type=range] {
    width:100%;
   
}
#message {
    min-height:35px;
    text-align:center;
    font-size:22px;
   
}
small {
    font-weight:normal;
   
}
.guide {
    background:#fff4c8;
    border-radius:12px;
    padding:12px;
    line-height:1.65;
    font-size:15px;
    margin-top:8px;
   
}
.guide strong {
    display:block;
    color:#7139b5;
   
}
#tracking {
    background:#fff0c2;
    padding:10px;
    border-radius:10px;
    font-size:15px;
   
}
#tracking[data-state="ok"] {
    background:#c9f8df;
    color:#145c39;
   
}
#tracking[data-state="grab"] {
    background:#e8d4ff;
    color:#5b239a;
   
}
#score {
    font-size:17px;
   
}
@media(max-width:720px) {
    main {
    grid-template-columns:1fr;
   
}
}

/* 짧은 가로 화면: 게임과 카메라를 한 화면에 유지 */
@media (orientation: landscape) {
    body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { flex: none; padding: 5px 12px; flex-wrap: nowrap; }
    h1 { font-size: clamp(16px, 2.5vw, 28px); }
    header button { padding: 7px; font-size: 13px; }
    main { flex: 1; min-height: 0; grid-template-columns: minmax(0, 2fr) minmax(230px, 1fr); gap: 8px; padding: 4px 10px 10px; }
    .machine { height: 100%; min-height: 0; display: flex; flex-direction: column; padding: 6px; border-width: 5px; }
    #game { flex: 1; min-height: 0; width: 100%; height: 0; object-fit: contain; margin: 4px 0; }
    .sign { font-size: 16px; padding: 4px; }
    #message { min-height: 24px; font-size: 16px; }
    .controls { flex-wrap: nowrap; gap: 4px; }
    .controls button { font-size: 18px; padding: 5px 9px; min-width: 36px; }
    aside { min-height: 0; overflow-y: auto; padding: 8px; }
    .modes button { font-size: 12px; padding: 6px; }
    #camera { max-width: 100%; width: auto; margin: auto; }
    #video { max-height: 24dvh; object-fit: contain; }
    #overlay { object-fit: contain; }
    .guide { font-size: 12px; padding: 5px; line-height: 1.35; }
    #status, #tracking { font-size: 12px; margin: 4px 0; padding: 4px; }
    aside h2 { font-size: 15px; margin: 5px 0; }
    #collection { grid-template-columns: repeat(9,1fr); gap: 2px; font-size: 18px; }
    #collection span { min-height: 24px; }
    #reset { padding: 5px; font-size: 12px; }
    aside p:last-child { margin: 4px 0; font-size: 11px; }
}
.machine { background: linear-gradient(120deg,#ff78bd,#a98aff,#65dce9); box-shadow: inset 0 0 0 3px #ffeaa0, 0 4px 0 #d68ad9; }
.sign { background: linear-gradient(90deg,#fff3a0,#fffbe8,#fff3a0); }
dialog { max-height: 90dvh; overflow: auto; }
</style>
 </head>
 <body>
  <header>
   <h1>
    🧸 AI 마법의 인형 뽑기 V2.0
   </h1>
   <div>
    <button id="full">
     ⛶ 전체 화면
    </button>

    </button>
   </div>
  </header>
  <main>
   <section class="machine">
    <div class="sign">
     마법의 인형 가게 · 9개 모으기

    </canvas>

    <div class="controls">

      ↓
     </button>

      →

   </section>
   <aside>
    <div class="modes">
     <button class="active" id="manual">
      터치 / PC
     </button>
     <button id="hand">
      AI 손 인식
     </button>
     <button id="pose">
      AI 신체 인식
     </button>
     <button id="cube">
      G큐브 (준비 중)
     </button>
    </div>
    <div class="guide" id="guide">
    </div>
    <p id="status" role="status">

    </p>
    <div id="camera" hidden>
      <video autoplay muted playsinline id="video"></video>
      <canvas id="overlay"></canvas>
    </div>
    <p id="tracking" role="status">
     터치 조작 준비 완료
    </p>
    <h2>
     🎁 내 인형 보관함
     <span id="score">
      0/9
     </span>
    </h2>
    <div id="collection">
    </div>
    <button id="reset">
     다시 시작
    </button>
    <p>
     <small>
      카메라 영상은 기기에서 분석하며 저장하거나 전송하지 않습니다. AI 모델 다운로드에는 인터넷이 필요합니다.
     </small>
    </p>
   </aside>
  </main>
  <dialog id="dialog">
   <h2>
    선생님 설정
   </h2>
   <label>
    움직임 속도 / 감도
    <input id="speed" max="10" min="1" type="range" value="5"/>
   </label>
   <label>
    <input checked="" id="assist" type="checkbox"/>
    성공 도움 (가장 가까운 인형)
   </label>
   <label>
    <input id="auto" type="checkbox"/>
    자동 뽑기 (2초 정지)
   </label>
   <label>
    <input id="sound" type="checkbox"/>
    효과음
   </label>
   <label>신체 조작 방식
    <select id="poseMode">
      <option value="two">한 손 이동 / 양손 아래 뽑기</option>
      <option value="one">한 손 이동 / 아래로 내리면 뽑기</option>
    </select>
   </label>
   <label>움직임 범위 (작을수록 민감)
    <input id="range" type="range" min="15" max="80" value="45"/>
   </label>
   <button id="calibrate">현재 손 위치를 중앙으로 보정</button>
   <p id="calibrationInfo">기본 중앙 위치 사용</p>
   <label>
    인형 테마
    <select id="theme">
     <option value="animals">
      동물
     </option>
     <option value="sea">
      바다
     </option>
     <option value="dino">
      공룡
     </option>
     <option value="fruit">
      과일
     </option>
     <option value="cars">
      자동차
     </option>
    </select>
   </label>
   <button id="close">
    닫기
   </button>
  </dialog>
  <script type="module">
