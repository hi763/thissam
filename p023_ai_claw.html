<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 마법의 인형 뽑기</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff5e7;color:#47394d;font: bold 17px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:10px;flex-wrap:wrap}h1{font-size:clamp(22px,4vw,36px);margin:0}button,select{font:inherit;border:0;border-radius:15px;padding:12px;background:#fff;color:#47394d;cursor:pointer;touch-action:none}button:focus-visible{outline:4px solid #1268ab}button.active,#grab{background:#7852a4;color:white}main{display:grid;grid-template-columns:minmax(0,3fr) minmax(230px,1fr);gap:15px;padding:0 16px 16px}.machine{background:#eaa1b9;border:7px solid #c77c99;border-radius:28px;padding:12px;box-shadow:0 7px #b76e8c}.sign{text-align:center;background:#ffe49a;border-radius:14px;padding:8px;font-size:23px}canvas{width:100%;display:block;background:#e4f5ff;border:5px solid white;border-radius:15px;margin:10px 0;aspect-ratio: 800/470}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.controls button{min-width:55px;font-size:25px}aside{background:#fff;border-radius:22px;padding:15px}#collection{display:flex;flex-wrap:wrap;gap:6px;min-height:80px;font-size:40px}#status{font-size:15px;min-height:48px;line-height:1.5}video{width:100%;max-height:180px;object-fit:contain;background:#222;border-radius:12px;transform:scaleX(-1)}.modes{display:flex;flex-wrap:wrap;gap:6px}.modes button{background:#eae3f5;font-size:15px}.modes button.active{background:#7852a4}dialog{border:0;border-radius:20px;max-width:90vw;color:inherit}dialog label{display:block;margin:15px 0}input[type=range]{width:100%}#message{min-height:35px;text-align:center;font-size:22px}small{font-weight:normal} @media(max-width:720px){main{grid-template-columns:1fr}aside{display:grid;gap:6px}video{max-height:120px}}
</style></head><body><header><h1>🧸 AI 마법의 인형 뽑기</h1><div><button id="full">⛶ 전체 화면</button> <button id="settings">⚙ 선생님 설정</button></div></header><main><section class="machine"><div class="sign">MAGIC TOY SHOP</div><canvas id="game" width="800" height="470" aria-label="인형 뽑기 게임"></canvas><div id="message" aria-live="polite">좋아하는 인형을 골라요!</div><div class="controls"><button data-dir="left" aria-label="왼쪽">←</button><button data-dir="up" aria-label="앞쪽">↑</button><button id="grab">뽑기!</button><button data-dir="down" aria-label="뒤쪽">↓</button><button data-dir="right" aria-label="오른쪽">→</button></div></section><aside><div class="modes"><button id="manual" class="active">터치 / PC</button><button id="hand">AI 손</button><button id="pose">AI 몸</button><button id="cube">G큐브 (준비 중)</button></div><p id="status" role="status">방향 버튼 또는 키보드 방향키, 스페이스바로 조작해요.</p><video id="video" autoplay playsinline muted hidden></video><h2>🎁 내 인형 보관함</h2><div id="collection"></div><button id="reset">다시 시작</button><p><small>카메라 영상은 기기에서 분석하며 저장하거나 전송하지 않습니다. AI 모델 다운로드에는 인터넷이 필요합니다.</small></p></aside></main><dialog id="dialog"><h2>선생님 설정</h2><label>움직임 속도 / 감도 <input id="speed" type="range" min="1" max="10" value="5"></label><label><input id="assist" type="checkbox" checked> 성공 도움 (가장 가까운 인형)</label><label><input id="auto" type="checkbox"> 자동 뽑기 (2초 정지)</label><label><input id="sound" type="checkbox"> 효과음</label><label>인형 테마 <select id="theme"><option value="animals">동물</option><option value="sea">바다</option><option value="dino">공룡</option><option value="fruit">과일</option><option value="cars">자동차</option></select></label><button id="close">닫기</button></dialog><script type="module">
const $=id=>document.getElementById(id), c=$('game'),ctx=c.getContext('2d');const themes={animals:['🧸','🐰','🐶','🐱','🐼','🦊'],sea:['🐬','🐳','🐙','🐠','🦀','🐢'],dino:['🦖','🦕','🐉','🥚','🦖','🦕'],fruit:['🍎','🍊','🍓','🍇','🍉','🍌'],cars:['🚗','🚕','🚙','🚓','🚒','🚑']};let toys=[],x=400,y=260,held=new Set(),anim=null,mode='manual',stream=null,model=null,token=0,lastVideo=-1,gesture=false,stable=0,prevX=x,prevY=y,autoLock=false, audio=null;
function reset(){toys=themes[$('theme').value].map((e,i)=>({e,x:155+(i%3)*245,y:260+Math.floor(i/3)*115,won:false}));x=400;y=260;anim=null;stable=0;autoLock=false;$('collection').replaceChildren();$('message').textContent='좋아하는 인형을 골라요!'}reset();
function grab(){if(anim)return;let t=toys.filter(t=>!t.won).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];if(!t){$('message').textContent='모두 모았어요!';return}if(!$('assist').checked&&Math.hypot(t.x-x,t.y-y)>65)t=null;anim={t,start:performance.now(),x,y};stable=0;autoLock=true;}
function finish(t){if(t){t.won=true;const span=document.createElement('span');span.textContent=t.e;$('collection').append(span);$('message').textContent='잘했어요! '+t.e+' 획득!';if($('sound').checked){try{audio??=new AudioContext();audio.resume();[523,659,784].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.045;o.connect(g).connect(audio.destination);o.start(audio.currentTime+i*.12);o.stop(audio.currentTime+i*.12+.15)})}catch{}}}else $('message').textContent='한 번 더 해볼까요?';anim=null}
function draw(now){let dt=Math.min(40,now-(draw.last||now));draw.last=now;let v=Number($('speed').value)*.12*dt;if(!anim){if(held.has('left'))x-=v;if(held.has('right'))x+=v;if(held.has('up'))y-=v;if(held.has('down'))y+=v;x=Math.max(65,Math.min(735,x));y=Math.max(220,Math.min(405,y));if(Math.hypot(x-prevX,y-prevY)>1){stable=0;autoLock=false}else stable+=dt;prevX=x;prevY=y;if($('auto').checked&&!autoLock&&stable>2000&&toys.some(t=>!t.won&&Math.hypot(t.x-x,t.y-y)<65))grab()}
ctx.clearRect(0,0,800,470);ctx.fillStyle='#e2f4fc';ctx.fillRect(0,0,800,470);ctx.fillStyle='#c5e3eb';ctx.fillRect(20,215,760,240);ctx.strokeStyle='#fff';ctx.lineWidth=3;for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(i*120,215);ctx.lineTo(i*120-80,455);ctx.stroke()}ctx.fillStyle='#a6b7c8';ctx.fillRect(35,35,730,12);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='76px system-ui';let ax=x,ay=110+(y-220)*.3,carried=null;if(anim){let p=(now-anim.start)/1800;if(p>=1){finish(anim.t)}else{let t=anim.t;if(t){ax=anim.x+(t.x-anim.x)*Math.min(1,p*4);if(p>.5)carried=t;}ay=110+(y-220)*.3+(p<.5?p*2:(1-p)*2)*( (t?.y||y)-155);if(p>.75&&t)ax=t.x+(700-t.x)*(p-.75)*4;}}
for(const t of toys){if(t.won||t===carried)continue;ctx.fillStyle='#abcbd4';ctx.beginPath();ctx.ellipse(t.x,t.y+35,37,10,0,0,7);ctx.fill();ctx.fillText(t.e,t.x,t.y)}ctx.strokeStyle='#b76e8c';ctx.setLineDash([7,6]);ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,52,30,0,0,7);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#68798b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(ax,45);ctx.lineTo(ax,ay);ctx.stroke();ctx.fillStyle='#8c9bad';ctx.fillRect(ax-23,ay-8,46,24);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ax-15,ay+10);ctx.lineTo(ax-35,ay+35);ctx.lineTo(ax-20,ay+52);ctx.moveTo(ax+15,ay+10);ctx.lineTo(ax+35,ay+35);ctx.lineTo(ax+20,ay+52);ctx.stroke();if(carried)ctx.fillText(carried.e,ax,ay+65);requestAnimationFrame(draw)}requestAnimationFrame(draw);
for(const b of document.querySelectorAll('[data-dir]')){let d=b.dataset.dir;b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);held.add(d)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>held.delete(d)}const keys={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};window.addEventListener('keydown',e=>{if($('dialog').open)return;if(keys[e.key]){e.preventDefault();held.add(keys[e.key])}if(e.code==='Space'&&e.target===document.body){e.preventDefault();if(!e.repeat)grab()}});window.addEventListener('keyup',e=>held.delete(keys[e.key]));window.addEventListener('blur',()=>held.clear());$('grab').onclick=grab;$('reset').onclick=reset;$('theme').onchange=reset;$('settings').onclick=()=>$('dialog').showModal();$('close').onclick=()=>$('dialog').close();$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};
function stop(){token++;stream?.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('video').hidden=true;model?.close();model=null;gesture=false;lastVideo=-1;held.clear()}
function select(m){mode=m;for(const id of ['manual','hand','pose'])$(id).classList.toggle('active',id===m)}$('manual').onclick=()=>{stop();select('manual');$('status').textContent='방향 버튼 또는 방향키로 조작해요.'};$('cube').onclick=()=>{$('status').textContent='G큐브 통신 모듈은 실물 및 통신 규격 검증 후 추가할 예정입니다.'};
async function start(m){stop();select(m);let id=token;let localModel=null,localStream=null;$('status').textContent='AI 모델을 불러오는 중… 카메라 권한을 허용해 주세요.';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 환경에서 실행해 주세요.');localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});if(id!==token){localStream.getTracks().forEach(t=>t.stop());return}stream=localStream;$('video').srcObject=stream;$('video').hidden=false;await $('video').play();const lib=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');const files=await lib.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');let opts={baseOptions:{modelAssetPath:m==='hand'?'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task':'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'},runningMode:'VIDEO'};localModel=m==='hand'?await lib.HandLandmarker.createFromOptions(files,{...opts,numHands:1}):await lib.PoseLandmarker.createFromOptions(files,{...opts,numPoses:1});if(id!==token){localModel.close();return}model=localModel;$('status').textContent=m==='hand'?'손을 펼쳐 움직이고 주먹을 쥐면 뽑아요.':'오른손을 움직이고 왼손을 어깨 위로 들면 뽑아요.';track(id,m)}catch(e){if(id!==token)return;stop();select('manual');$('status').textContent='AI 연결 실패: '+e.message+' — 터치 모드를 사용해 주세요.'}}
function track(id,m){if(id!==token||!model)return;try{const video=$('video');if(video.readyState>=2&&video.currentTime!==lastVideo){lastVideo=video.currentTime;const r=model.detectForVideo(video,performance.now());const p=r.landmarks?.[0];if(p){let q=m==='hand'?p[9]:p[16];let g=false;if(m==='hand'){let dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);g=[8,12,16,20].filter((i,j)=>dist(p[i],p[0])<dist(p[[6,10,14,18][j]],p[0])*1.12).length>=3}else{g=p[15].y<p[11].y-.05&&(p[15].visibility??1)>.5}if(!anim&&!g&&(q.visibility??1)>.5){let gain=Number($('speed').value)/5;let tx=400+(.5-q.x)*900*gain,ty=310+(q.y-.5)*300*gain;x+=(Math.max(65,Math.min(735,tx))-x)*.22;y+=(Math.max(220,Math.min(405,ty))-y)*.22}if(g&&!gesture)grab();gesture=g}else gesture=false}}catch(e){stop();select('manual');$('status').textContent='인식 오류: '+e.message;return}requestAnimationFrame(()=>track(id,m))}$('hand').onclick=()=>start('hand');$('pose').onclick=()=>start('pose');window.addEventListener('pagehide',stop);
</script></body></html>
